<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TalentCV AI (prueba)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    code { background: #eee; padding: .1rem .3rem; border-radius: 4px; }
    .ok { color: #0a6b2d; } .mal { color: #a40000; }
  </style>
</head>
<body>
  <h1>TalentCV AI</h1>
  <p>Prueba de empaquetado: el interfaz, el backend y la IA local.</p>
  <ul>
    <li>Backend: <span id="backend" role="status">comprobando…</span></li>
    <li>IA local (Ollama): <span id="ia" role="status">comprobando…</span></li>
  </ul>
  <script>
    const token = location.hash.slice(1);
    history.replaceState(null, "", location.pathname);
    const api = (p) => fetch(p, { headers: { "x-tcv-token": token } }).then(r => r.json());
    const set = (id, ok, txt) => { const e = document.getElementById(id); e.textContent = txt; e.className = ok ? "ok" : "mal"; };
    api("/api/ping").then(d => set("backend", d.ok, "activo (v" + d.version + ")")).catch(() => set("backend", false, "sin respuesta"));
    api("/api/ia/estado").then(d => set("ia", d.disponible, d.disponible ? "Ollama " + d.version + " · modelos: " + d.modelos.join(", ") : "no disponible"))
      .catch(() => set("ia", false, "sin respuesta"));
  </script>
</body>
</html>
