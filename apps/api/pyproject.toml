[project]
name = "talentcv-api"
version = "0.1.0"
description = "Backend local de TalentCV AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() en argumentos es el idioma normal de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # datos de prueba y SQL literal
"app/migrations/*" = ["E501"]  # SQL literal
